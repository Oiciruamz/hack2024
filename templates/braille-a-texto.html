<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">  
    <title>Traductor Braille a Español</title>
    <style>
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            font-family: Poppins, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #6A36B3;
            padding: 5px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            padding: 5px;
        }

        .search-bar input[type="text"] {
            border: none;
            outline: none;
            padding: 10px;
            width: 500px;
            border-radius: 20px 0 0 20px;
        }

        .search-bar button {
            background-color: #2b292d;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }

        header nav {
            display: flex;
            align-items: center;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        header .btn {
            background-color: white;
            font-size: medium;
            padding: 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        header nav a img {
            margin-left: 2px;
            width: 15px;
            height: 15px;
            margin-right: 5px;
        }

        .container {
            text-align: center;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #000;
            font-weight: 700;
            font-size: 2em;
        }

        textarea {
            width: 80%;
            max-width: 800px;
            height: 300px;
            padding: 20px;
            font-size: 1.2em;
            border: 2px solid #6A36B3;
            border-radius: 10px;
            resize: vertical;
            margin-bottom: 20px;
        }

        .submit-btn {
            background-color: #6A36B3;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #55299A;
        }
    </style>
</head>
<body>

    {% include 'header.html' %}

    <div class="container">
        <h1>Traductor de Braille a Texto</h1>
        <p>Pega o escribe tu texto en código Braille aquí abajo:</p>

        <form action="/braille-a-texto" method="POST" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <textarea name="braille_text" placeholder="⠨⠑⠎⠞⠕ ⠑⠎ ⠥⠝ ⠑⠚⠑⠍⠏⠇⠕" required></textarea>
            <button type="submit" class="submit-btn">Traducir a Español</button>
        </form>
    </div>

</body>
</html>
