<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header_inicio.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">  
    <title>Resultado de Braille</title>
    <style>
        .container {
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #000;
            font-weight: 700;
            font-size: 2em;
            margin-bottom: 50px;
        }

        .container a {
            width: 250px;
            padding: 30px;
            font-size: medium;
            border: 1px solid #6A36B3;
            border-radius: 20px;
            margin-bottom: 40px;
            text-decoration: none;
        }

        .descargar {
            cursor: pointer;
            padding: 30px;
            width: 250px;
            border-radius: 20px;
            border: 1px solid #6A36B3;
            background-color: #6A36B3;
            color: #fff;
            font-weight: bold;
        }

        .descargar:hover {
            background-color: #55299A;
        }

        .subir {
            background-color: #d6bcf8;
            font-size: medium;
            font-weight: 600;
        }

        .subir:hover {
            background-color: #bfa6f0;
        }

        .subir img {
            width: 12px;
        }

        .descargar img {
            width: 15px;
        }

        @media (max-width: 1100px) {
            .container {
                margin-top: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.2em;
            }
        }

    </style>
</head>
<body>

    {% include 'header.html' %}

    <div class="container">
        <h1>Archivo PDF traducido a código Braille</h1>

        <div style="display: flex; gap: 20px; justify-content: center;">
            <form action="/download_braille" method="POST">
                <input type="hidden" name="download_id" value="{{download_id}}">
                <input type="hidden" name="original_filename" value="{{original_filename}}">
                <button type="submit" class="descargar" style="font-size: medium; background-color: #6A36B3;">
                    <img src="{{ url_for('static', filename='images/descargar.png') }}" style="filter: brightness(0) invert(1);" alt="Icono de descargar">
                    Descargar en PDF
                </button>
            </form>

            <form action="/download_brf" method="POST">
                <input type="hidden" name="download_id" value="{{download_id}}">
                <input type="hidden" name="original_filename" value="{{original_filename}}">
                <button type="submit" class="descargar" style="font-size: medium; background-color: #2b292d;">
                    <img src="{{ url_for('static', filename='images/descargar.png') }}" style="filter: brightness(0) invert(1);" alt="Icono de descargar">
                    Descargar en BRF
                </button>
            </form>
        </div>

        <!-- <p style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">ó</p>

        <a class="subir" href="/" style="font-size: medium;">
            <img src="{{ url_for('static', filename='images/iconotransferir.svg') }}" alt="Icono de subir">
            Subir Archivo
        </a> -->

        <!-- <p>{{braille}}</p> Solo estaba comprobando si recibia el braille -->
    </div>

    {% include 'footer.html' %}
</body>
</html>
