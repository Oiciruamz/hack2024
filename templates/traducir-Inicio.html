<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header_inicio.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">  
    <title>Traducir PDF a Braille</title>
    <style>

        .container {
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #000;
            font-weight: 700;
            font-size: 2em;
        }

        .upload-btn {
            display: block;
            /* width: 500px; */
            background-color: #6A36B3;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .upload-btn:hover {
            background-color: #55299A;
        }

        .dropzone {
            width: 500px;
            border: 2px dashed #6A36B3;
            padding: 50px;
            margin-top: 20px;
            border-radius: 10px;
            color: #6A36B3;
            cursor: pointer;
        }

        .dropzone:hover {
            background-color: #EDE7F6;
        }

        #loading-spinner {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid #6A36B3;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1100px) {
            .container {
                margin-top: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .upload-btn {
                padding: 15px 30px;
                font-size: 1em;
            }

            /* Ajustar el tamaño de la zona de arrastre */
            .dropzone {
                width: 100%;
                padding: 30px;
            }
        }

        @media (max-width: 480px) {
            .upload-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            h1 {
                font-size: 1.2em;
            }
        }

    </style>
</head>
<body>

    {% include 'header.html' %}

    <main class="container" id="form-content">
        <h1>Traducir archivo PDF a código Braille</h1>
        <p>Ingresa el archivo que deseas traducir</p>

        <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <input style="display: none;" id="subir" class="upload-btn" type="file" name="pdf_file" accept=".pdf,application/pdf" required aria-label="Seleccionar archivo PDF para traducir">
            <label for="subir" class="upload-btn" tabindex="0" role="button" aria-label="Selecciona el archivo PDF desde tu dispositivo">Selecciona el archivo</label>
        </form>

        <div class="dropzone" id="dropzone" tabindex="0" role="region" aria-label="Zona para arrastrar y soltar archivo PDF">
            ó arrastra tu archivo aquí
        </div>
        <div id="file-error" class="text-danger mt-3" style="display:none; font-weight: 500;" role="alert"></div>
    </main>

    <div id="loading-spinner" role="status" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <h2>Traduciendo el archivo, por favor espera...</h2>
    </div>

    <script>
        const fileInput = document.getElementById('subir');
        const form = document.getElementById('upload-form');
        const formContent = document.getElementById('form-content');
        const loadingSpinner = document.getElementById('loading-spinner');
        const dropzone = document.getElementById('dropzone');
        const fileError = document.getElementById('file-error');
        const fileLabel = document.querySelector('label[for="subir"]');

        function procesarArchivo(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                fileError.textContent = 'Formato no permitido: solo se aceptan archivos PDF.';
                fileError.style.display = 'block';
                return;
            }
            fileError.style.display = 'none';
            formContent.style.display = 'none';
            loadingSpinner.style.display = 'flex';
            form.submit();
        }

        // Evento de selección de archivo normal
        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                procesarArchivo(fileInput.files[0]);
            }
        });

        // Soporte de accesibilidad por teclado para el label
        fileLabel.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        });

        // Drag & Drop
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.style.backgroundColor = '#EDE7F6';
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.style.backgroundColor = '';
            });
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                procesarArchivo(files[0]);
            }
        });
    </script>

    {% include 'footer.html' %}
</body>
</html>
