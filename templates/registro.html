<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en Letras Inclusivas y guarda tus listas de libros en Braille.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:wght@400..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <title>Crear cuenta · Letras Inclusivas</title>
</head>

<body class="auth-body">
    <a href="{{ url_for('inicio') }}" class="auth-marca">Letras Inclusivas</a>

    <main class="auth-card">
        <h1>Crea tu cuenta</h1>

        {% if error_config %}
        <div class="auth-alerta auth-alerta-aviso" role="note">
            <strong>Configuración pendiente:</strong> {{ error_config }}
        </div>
        {% endif %}

        <div id="error-message" class="auth-alerta auth-alerta-error" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
        <div id="info-message" class="auth-alerta auth-alerta-info" role="status" aria-live="polite" hidden></div>

        <form id="auth-form" class="auth-form" data-modo="registro" novalidate>
            <div class="auth-campo">
                <label for="nombre">Nombre de usuario*</label>
                <input type="text" id="nombre" name="nombre" autocomplete="nickname" maxlength="60" placeholder="Tu nombre" required>
            </div>

            <div class="auth-campo">
                <label for="email">Correo electrónico*</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="auth-campo">
                <label for="password">Contraseña* <span style="font-weight: 400; color: #6B7280;">(mínimo 6 caracteres)</span></label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submit-btn" class="auth-btn auth-btn-primario">Registrarse</button>
        </form>

        {% include 'partials/auth_firebase.html' %}

        <div class="auth-pie">
            <a href="{{ url_for('login', next=siguiente) }}" id="link-login" class="auth-link">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </div>
    </main>
</body>
</html>
