<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Letras Inclusivas para guardar tus listas de libros en Braille.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:wght@400..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <title>Iniciar sesión · Letras Inclusivas</title>
</head>

<body class="auth-body">
    <a href="{{ url_for('inicio') }}" class="auth-marca">Letras Inclusivas</a>

    <main class="auth-card">
        <h1>Inicia sesión con tu cuenta</h1>

        {% if error_config %}
        <div class="auth-alerta auth-alerta-aviso" role="note">
            <strong>Configuración pendiente:</strong> {{ error_config }}
        </div>
        {% endif %}

        <div id="error-message" class="auth-alerta auth-alerta-error" role="alert" aria-live="assertive" tabindex="-1" hidden></div>
        <div id="info-message" class="auth-alerta auth-alerta-info" role="status" aria-live="polite" hidden></div>

        <form id="auth-form" class="auth-form" data-modo="login" novalidate>
            <div class="auth-campo">
                <label for="email">Correo electrónico*</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="auth-campo">
                <label for="password">Contraseña*</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <a href="#" id="reset-link" class="auth-link auth-olvido">¿Olvidaste tu contraseña?</a>

            <button type="submit" id="submit-btn" class="auth-btn auth-btn-primario">Iniciar sesión</button>
        </form>

        {% include 'partials/auth_firebase.html' %}

        <div class="auth-pie">
            <a href="{{ url_for('registro', next=siguiente) }}" id="link-registro" class="auth-link">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </main>
</body>
</html>
